# 本机没有 MySQL 时的演示配置。业务规则与 MySQL 环境一致，数据保存在内存中，重启即清空。
spring:
  datasource:
    driver-class-name: org.h2.Driver
    url: jdbc:h2:mem:purchase_db;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE
    username: sa
    password:
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema-h2.sql
